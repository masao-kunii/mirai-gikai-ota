# Dependabot（依存関係の自動更新）設定
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# 方針:
# - パッケージは pnpm ワークスペース（ルートの pnpm-lock.yaml 一本）。npm エコシステムを
#   directory: "/" に1つ置けば、apps/* ・ packages/* ・ admin ・ web の各 package.json を
#   まとめて更新できる。サブディレクトリ（例: /apps/api）を個別指定すると、そこに
#   ロックファイルが無く失敗するので指定しない。
# - GitHub Actions は SHA ピン運用（pinact）。Dependabot は SHA を維持したまま更新するため両立する。
# - 洪水を避けつつ安全側に倒すため、**patch のみ**をグループにまとめる。minor と major は
#   個別 PR にしてレビューする（過去に「minor」表記でも破壊的変更を含む更新が複数あったため）。
# - 移行が別タスク級・破壊的変更が確認済みの重量級依存は当面 ignore し、個別に計画実施する。
# - 供給網リスク低減のため cooldown（公開直後の版は避ける）を設定する。
# - デフォルトブランチが ota/develop のため、PR は ota/develop に対して作成される（target-branch 不要）。
version: 2
updates:
  # npm 依存（pnpm ワークスペース全体）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # 破壊的変更が確認済み／移行が別タスク級のもの。個別に計画して更新する。
      # （2026-07 の一括更新でビルド/型/lint が壊れたため当面除外）
      - dependency-name: "@biomejs/biome"
      - dependency-name: "@supabase/supabase-js"
      - dependency-name: "@hookform/resolvers"
      - dependency-name: "rehype-*"
      # AI SDK の v-bump（ai / @ai-sdk/*）はまとめて移行するタスクにする。
      - dependency-name: "ai"
      - dependency-name: "@ai-sdk/*"
      # Node のランタイムは 22 系。@types/node の major は追わない（minor/patch は許可）。
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      # patch のみを1つの PR にまとめる。minor / major は個別 PR にしてレビューする。
      npm-patch:
        applies-to: version-updates
        update-types:
          - "patch"

  # GitHub Actions（.github/workflows/*）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
