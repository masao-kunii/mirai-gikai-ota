name: Integration Tests

on:
  push:
    branches: [main, develop, ota/develop]
  pull_request:
    branches: [main, develop, ota/develop]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,realtime,edge-runtime,supavisor,inbucket

      - name: Export Supabase env vars
        run: |
          {
            echo "SUPABASE_URL=http://127.0.0.1:54421"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54421"
            supabase status -o env \
              | grep -E '^(PUBLISHABLE_KEY|SECRET_KEY)=' \
              | sed -e 's/^PUBLISHABLE_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/' \
                    -e 's/^SECRET_KEY="\(.*\)"$/SUPABASE_SECRET_KEY=\1/'
          } >> "$GITHUB_ENV"

      - name: Run Integration Tests with Coverage
        run: pnpm test:integration:coverage

      - name: Upload coverage to Codecov
        # CODECOV_TOKEN 未設定でも CI を落とさない（カバレッジ送信は任意）
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          files: ./web/coverage-integration/coverage-final.json
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}

  # 新スタック（apps/web SSR + apps/api）の E2E スモーク。
  # ローカル Supabase を空のまま起動し、globalSetup が published 議案を投入する。
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,realtime,edge-runtime,supavisor,inbucket

      - name: Install Playwright browser
        run: pnpm --filter public-web exec playwright install --with-deps chromium

      - name: Run E2E smoke (apps/web + apps/api)
        run: pnpm --filter public-web run test:e2e
