name: Sync Minutes

# 大田区議会の本会議録（速報版）を Cloud Supabase へ毎日同期する。
#   1. 速報版ページから議事録 PDF の一覧を読み、未登録のものを追加
#   2. 本文が空の議事録について、PDF から文字を抜き出して保存
#
# 大田区の公式サイトは Cloudflare Workers からのアクセスを 403 で拒否するため、
# 管理画面（api Worker）ではなく GitHub Actions 側で取得する。
#
# 対象は定例会のみ。臨時会は会期を登録しない運用なのでスキップする（ログに表示）。
# 既存の本文は上書きしない（管理画面で手直しした本文を守るため）。
#
# 静かなスキップ禁止（TARGET_ARCHITECTURE §8-4）:
#   定例会の会期が DB に無い・本文の抽出に失敗した、のいずれかがあるとジョブは失敗する。
#   失敗通知を受けたらログの警告アノテーションを確認すること。
#
# 必要な GitHub Secrets:
#   - SUPABASE_URL          : Cloud Supabase の URL（https://<ref>.supabase.co）
#   - SUPABASE_SECRET_KEY   : Cloud Supabase の secret key（sb_secret_...）

on:
  # 毎日 10:30 JST（01:30 UTC）。議案の同期（sync_teirei、10:00）のあとに走らせる。
  schedule:
    - cron: "30 1 * * *"
  # 手動実行（速報版に新しい議事録が載ったのを見たときにすぐ取り込みたいとき）
  workflow_dispatch:

concurrency:
  group: sync-minutes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync minutes into Cloud Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm --filter @mirai-gikai/seed run sync:minutes
