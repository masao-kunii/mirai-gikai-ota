name: Pinact Check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main, develop, ota/develop]
    paths:
      - '.github/workflows/**'

jobs:
  pinact-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run pinact
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          skip_push: "true"
