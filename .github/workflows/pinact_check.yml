name: Pinact Check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main, develop, ota/develop]
    paths:
      - '.github/workflows/**'

jobs:
  pinact-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run pinact
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: "true"
