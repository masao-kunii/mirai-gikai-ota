name: Code Check

on:
  push:
    branches: [main, develop, ota/develop]
  pull_request:
    branches: [main, develop, ota/develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint & format check
        run: pnpm run lint

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      - name: Run build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy-for-build-check

      - name: Run Test with Coverage
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        # CODECOV_TOKEN 未設定でも CI を落とさない（カバレッジ送信は任意）
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          files: ./web/coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
