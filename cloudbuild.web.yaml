# Cloud Build パイプライン: web アプリを Artifact Registry にビルドして Cloud Run へデプロイ
# 利用方法:
#   gcloud builds submit --config=cloudbuild.web.yaml \
#     --substitutions=_REGION=asia-northeast1,_REPO=mirai-gikai-ota,_SERVICE=mirai-gikai-ota-web

substitutions:
  _REGION: asia-northeast1
  _REPO: mirai-gikai-ota
  _SERVICE: mirai-gikai-ota-web
  _SERVICE_ACCOUNT: mirai-gikai-ota-web@mirai-gikai-ota.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# Cloud Build から Secret Manager の値を build-arg として読み込む
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/next-public-supabase-url/versions/latest
      env: SUPABASE_URL_VALUE
    - versionName: projects/${PROJECT_ID}/secrets/next-public-supabase-publishable-key/versions/latest
      env: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
    - versionName: projects/${PROJECT_ID}/secrets/supabase-secret-key/versions/latest
      env: SUPABASE_SECRET_KEY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    secretEnv:
      - SUPABASE_URL_VALUE
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
      - SUPABASE_SECRET_KEY
    args:
      - -c
      - |
        docker build \
          --file=web/Dockerfile \
          --build-arg=NEXT_PUBLIC_SUPABASE_URL="$$SUPABASE_URL_VALUE" \
          --build-arg=SUPABASE_URL="$$SUPABASE_URL_VALUE" \
          --build-arg=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
          --build-arg=SUPABASE_SECRET_KEY="$$SUPABASE_SECRET_KEY" \
          --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID} \
          --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest \
          .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --concurrency=80
      - --min-instances=0
      - --max-instances=10
      - --timeout=3600
      - --set-env-vars=GOOGLE_VERTEX_LOCATION=${_REGION},GOOGLE_VERTEX_PROJECT=${PROJECT_ID}
      # 機密値・接続情報は Secret Manager から読み込ませる
      - --update-secrets=SUPABASE_URL=next-public-supabase-url:latest,NEXT_PUBLIC_SUPABASE_URL=next-public-supabase-url:latest,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=next-public-supabase-publishable-key:latest,SUPABASE_SECRET_KEY=supabase-secret-key:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
