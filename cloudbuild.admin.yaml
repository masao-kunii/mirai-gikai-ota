# Cloud Build パイプライン: admin アプリを Artifact Registry にビルドして Cloud Run へデプロイ
# 利用方法:
#   gcloud builds submit --config=cloudbuild.admin.yaml \
#     --substitutions=_REGION=asia-northeast1,_REPO=mirai-gikai-ota,_SERVICE=mirai-gikai-ota-admin

substitutions:
  _REGION: asia-northeast1
  _REPO: mirai-gikai-ota
  _SERVICE: mirai-gikai-ota-admin
  _SERVICE_ACCOUNT: mirai-gikai-ota-admin@${PROJECT_ID}.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=admin/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}
      # admin は IAP / 内部からのアクセスのみを想定。外部 unauth は外す。
      - --no-allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --concurrency=40
      - --min-instances=0
      - --max-instances=5
      - --timeout=3600
      - --set-env-vars=GOOGLE_VERTEX_LOCATION=${_REGION},GOOGLE_VERTEX_PROJECT=${PROJECT_ID}
      - --update-secrets=SUPABASE_URL=mirai-gikai-ota-supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=mirai-gikai-ota-supabase-service-key:latest,NEXT_PUBLIC_SUPABASE_URL=mirai-gikai-ota-supabase-url:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=mirai-gikai-ota-supabase-anon:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
